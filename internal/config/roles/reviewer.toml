# Reviewer role definition
# Rig-level on-demand code reviewer. Dispatched by the Refinery (and crew).
# Replaces the externally-hosted Augment review app in the PR review loop.

role = "reviewer"
scope = "rig"
nudge = "Check your hook/mail for a review request, then run 'gt prime'."
prompt_template = "reviewer.md.tmpl"

[session]
pattern = "{prefix}-reviewer"
work_dir = "{town}/{rig}/reviewer/rig"
needs_pre_sync = true
start_command = "exec claude --dangerously-skip-permissions"

[env]
GT_ROLE = "{rig}/reviewer"
GT_SCOPE = "rig"

[health]
ping_timeout = "30s"
consecutive_failures = 3
kill_cooldown = "5m"
# ENFORCED by the daemon's reviewer reaper (internal/daemon/reviewer_reaper.go).
# Heartbeat age past this nudges the session; 2x kills it; 4x of TOTAL review
# time (heartbeat elapsed) is a hard kill that a looping reviewer cannot evade.
# Must stay above pr_review_timeout (30m) so the refinery's await-review
# escalation — which carries diagnostics a silent kill would destroy — fires
# first. Note the perspective subagents run between `gt reviewer prompt` and
# `gt reviewer consolidate` with nothing refreshing the heartbeat, so this must
# accommodate a full subagent pass.
stuck_threshold = "45m"
